<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AXIS Dark Neon Ball Sort</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:linear-gradient(135deg,#0f0f1a,#0b1026);
    color:white;
    text-align:center;
}
h1{
    margin:20px 0;
    text-shadow:0 0 20px #00ffff;
}
#board{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:20px;
    margin:30px;
}
.tube{
    width:90px;
    height:240px;
    border:3px solid #00ffff;
    border-radius:20px;
    display:flex;
    flex-direction:column-reverse;
    padding:10px;
    cursor:pointer;
    box-shadow:0 0 20px #00ffff55;
    transition:0.2s;
}
.tube.selected{
    box-shadow:0 0 30px #ff00ff;
}
.ball{
    width:60px;
    height:60px;
    border-radius:50%;
    margin:3px auto;
    box-shadow:0 0 15px white inset;
}
#ui{
    margin-top:10px;
}
button{
    padding:10px 20px;
    border:none;
    border-radius:10px;
    background:#00ffff;
    color:black;
    font-weight:bold;
    cursor:pointer;
}
button:hover{
    background:#ff00ff;
    color:white;
}
#win{
    font-size:24px;
    color:#00ff88;
    text-shadow:0 0 20px #00ff88;
    display:none;
}
</style>
</head>
<body>

<h1>AXIS Dark Neon Ball Sort</h1>

<div id="ui">
    ⏱️ <span id="timer">0</span> ثانية
    <br><br>
    <button onclick="restart()">إعادة</button>
</div>

<div id="board"></div>

<div id="win">🎉 فزت! 🎉</div>

<script>
const capacity = 4;
let tubes = [];
let selected = null;
let startTime;
let timerInterval;

function generateLevel(){
    return [
        ["red","blue","green","yellow"],
        ["yellow","green","blue","red"],
        [],
        []
    ];
}

function startGame(){
    tubes = JSON.parse(localStorage.getItem("save")) || generateLevel();
    startTime = Date.now();
    timerInterval = setInterval(updateTimer,1000);
    render();
}

function updateTimer(){
    let sec = Math.floor((Date.now()-startTime)/1000);
    document.getElementById("timer").innerText = sec;
}

function render(){
    const board = document.getElementById("board");
    board.innerHTML="";
    tubes.forEach((tube,i)=>{
        const div = document.createElement("div");
        div.className="tube";
        if(selected===i) div.classList.add("selected");
        div.onclick=()=>selectTube(i);
        tube.forEach(color=>{
            const ball=document.createElement("div");
            ball.className="ball";
            ball.style.background=color;
            div.appendChild(ball);
        });
        board.appendChild(div);
    });
}

function selectTube(index){
    if(selected===null){
        if(tubes[index].length===0) return;
        selected=index;
    }else{
        move(selected,index);
        selected=null;
    }
    render();
}

function move(from,to){
    if(from===to) return;
    if(tubes[from].length===0) return;
    if(tubes[to].length>=capacity) return;

    const ball=tubes[from][tubes[from].length-1];
    if(tubes[to].length===0 || tubes[to][tubes[to].length-1]===ball){
        tubes[to].push(tubes[from].pop());
        save();
        checkWin();
    }
}

function checkWin(){
    let win=true;
    for(let tube of tubes){
        if(tube.length===0) continue;
        if(tube.length!==capacity) win=false;
        if(!tube.every(c=>c===tube[0])) win=false;
    }
    if(win){
        clearInterval(timerInterval);
        document.getElementById("win").style.display="block";
    }
}

function save(){
    localStorage.setItem("save",JSON.stringify(tubes));
}

function restart(){
    localStorage.removeItem("save");
    location.reload();
}

startGame();
</script>

</body>
</html>
