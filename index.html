<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AXIS GOD ENGINE — PRO</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>

:root{
    --neon:#00f0ff;
    --bg1:#050816;
    --bg2:#0d1428;
    --glass:rgba(255,255,255,0.05);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Orbitron',sans-serif;
}

body{
    background:linear-gradient(145deg,var(--bg1),var(--bg2));
    color:white;
    overflow-x:hidden;
}

/* ===== Header ===== */

header{
    padding:20px;
    text-align:center;
    font-size:28px;
    letter-spacing:3px;
    color:var(--neon);
    text-shadow:0 0 15px var(--neon);
    animation: glow 2s infinite alternate;
}

@keyframes glow{
    from{ text-shadow:0 0 10px var(--neon);}
    to{ text-shadow:0 0 25px var(--neon);}
}

/* ===== HUD ===== */

.hud{
    display:flex;
    justify-content:center;
    gap:40px;
    padding:15px;
    backdrop-filter:blur(10px);
    background:var(--glass);
    border-bottom:1px solid rgba(255,255,255,0.1);
}

.hud span{
    font-size:14px;
    color:#ccc;
}

.hud strong{
    color:var(--neon);
}

/* ===== Game Board ===== */

.game-container{
    display:flex;
    justify-content:center;
    gap:25px;
    margin-top:60px;
    flex-wrap:wrap;
}

.tube{
    width:90px;
    height:300px;
    border:2px solid var(--neon);
    border-radius:20px;
    display:flex;
    flex-direction:column-reverse;
    align-items:center;
    padding:10px;
    gap:10px;
    cursor:pointer;
    transition:0.3s;
    background:rgba(0,0,0,0.4);
}

.tube:hover{
    box-shadow:0 0 20px var(--neon);
    transform:translateY(-5px);
}

.ball{
    width:60px;
    height:60px;
    border-radius:50%;
    animation:pop 0.3s ease;
}

@keyframes pop{
    from{ transform:scale(0);}
    to{ transform:scale(1);}
}

/* ===== Buttons ===== */

.controls{
    text-align:center;
    margin-top:40px;
}

button{
    padding:10px 25px;
    margin:5px;
    border:none;
    border-radius:8px;
    background:var(--neon);
    color:black;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.1);
    box-shadow:0 0 15px var(--neon);
}

/* ===== Shop Panel ===== */

.shop{
    margin-top:60px;
    padding:30px;
    text-align:center;
    backdrop-filter:blur(12px);
    background:var(--glass);
    border-top:1px solid rgba(255,255,255,0.1);
}

.skin{
    display:inline-block;
    margin:10px;
    padding:10px 20px;
    border:1px solid var(--neon);
    border-radius:10px;
    cursor:pointer;
    transition:0.3s;
}

.skin:hover{
    background:var(--neon);
    color:black;
}

/* ===== Responsive ===== */

@media(max-width:768px){
    .tube{
        width:70px;
        height:240px;
    }
    .ball{
        width:45px;
        height:45px;
    }
}

</style>
</head>
<body>

<header>AXIS GOD ENGINE</header>

<div class="hud">
    <span>💰 Coins: <strong id="coins">200</strong></span>
    <span>⭐ XP: <strong id="xp">450</strong></span>
    <span>🏆 Level: <strong id="level">6</strong></span>
</div>

<div class="game-container" id="board"></div>

<div class="controls">
    <button onclick="resetGame()">إعادة</button>
</div>

<div class="shop">
    <h2>المتجر</h2>
    <div class="skin" onclick="buySkin()">شراء Neon Skin (200)</div>
</div>

<script>

let coins = 200;
let colors = ["red","yellow","blue","green"];
let tubesData = [
    ["green","red","blue","green"],
    ["yellow","green","red","yellow"],
    ["blue","red","yellow","blue"],
    []
];

let selectedTube = null;

function render(){
    const board = document.getElementById("board");
    board.innerHTML = "";

    tubesData.forEach((tube,index)=>{
        const tubeDiv = document.createElement("div");
        tubeDiv.className = "tube";
        tubeDiv.onclick = ()=>selectTube(index);

        tube.forEach(color=>{
            const ball = document.createElement("div");
            ball.className="ball";
            ball.style.background=color;
            tubeDiv.appendChild(ball);
        });

        board.appendChild(tubeDiv);
    });
}

function selectTube(index){
    if(selectedTube === null){
        selectedTube = index;
    }else{
        moveBall(selectedTube,index);
        selectedTube = null;
    }
}

function moveBall(from,to){
    if(tubesData[from].length === 0) return;
    let ball = tubesData[from].pop();
    tubesData[to].push(ball);
    render();
}

function resetGame(){
    location.reload();
}

function buySkin(){
    if(coins>=200){
        coins-=200;
        document.getElementById("coins").innerText=coins;
        document.documentElement.style.setProperty('--neon','#ff00ff');
        alert("تم شراء السكن بنجاح!");
    }else{
        alert("لا يوجد رصيد كافي");
    }
}

render();

</script>

</body>
</html>
