<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AXIS GOD ENGINE - ULTRA STORE EDITION</title>

<style>
:root{
--bg1:#050816;
--bg2:#0e1635;
--neon:#00f0ff;
--glass:rgba(255,255,255,0.05);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{
background:linear-gradient(135deg,var(--bg1),var(--bg2));
color:white;text-align:center
}
header{
padding:20px;font-size:26px;color:var(--neon);
text-shadow:0 0 20px var(--neon)
}
.hud{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding:10px}
.card{padding:6px 12px;border:1px solid var(--neon);border-radius:8px}
button{
padding:6px 12px;margin:4px;border:none;border-radius:6px;
background:var(--neon);color:black;font-weight:bold;cursor:pointer
}
.game{display:flex;justify-content:center;gap:15px;margin-top:30px;flex-wrap:wrap}
.tube{
width:70px;height:240px;border:2px solid var(--neon);
border-radius:20px;display:flex;flex-direction:column-reverse;
align-items:center;padding:8px;gap:6px;cursor:pointer
}
.ball{width:45px;height:45px;border-radius:50%}
.section{margin-top:25px;padding:15px;background:var(--glass)}
.store-item{margin:6px}
</style>
</head>
<body>

<header>AXIS GOD ENGINE — ULTRA STORE</header>

<div class="hud">
<div class="card">💰 <span id="coins"></span></div>
<div class="card">💎 <span id="gems"></span></div>
<div class="card">⭐ XP: <span id="xp"></span></div>
<div class="card">🏆 Level: <span id="level"></span></div>
<div class="card">🔥 Rank: <span id="rank"></span></div>
</div>

<div>
<button onclick="newGame()">New</button>
<button onclick="undo()">Undo</button>
<button onclick="hint()">Hint</button>
</div>

<div class="game" id="board"></div>

<div class="section">
<h2>🏪 STORE</h2>

<h3>🎨 Skins</h3>
<div id="skinsStore"></div>

<h3>✨ Effects</h3>
<div id="effectsStore"></div>

<h3>🚀 Boosters</h3>
<div id="boostersStore"></div>

</div>

<script>

// ================= SAVE =================

let save = JSON.parse(localStorage.getItem("axisSave")) || {
coins:2000,
gems:200,
xp:0,
level:1,
rank:"Bronze",
wins:0,
inventory:{skins:{},effects:{},boosters:{}},
equipped:{skin:null,effect:null},
boostersActive:{xp2:0,coins2:0}
};

function saveData(){
localStorage.setItem("axisSave",JSON.stringify(save));
}

// ================= STORE DATA =================

const STORE = {
skins:[
{id:"neon",name:"Neon Glow",price:500,type:"coins"},
{id:"gold",name:"Gold",price:1000,type:"coins"},
{id:"shadow",name:"Shadow",price:150,type:"gems"},
{id:"rainbow",name:"Rainbow",price:300,type:"gems"}
],
effects:[
{id:"fire",name:"Fire",price:800,type:"coins"},
{id:"lightning",name:"Lightning",price:200,type:"gems"},
{id:"pulse",name:"Pulse",price:1200,type:"coins"}
],
boosters:[
{id:"xp2",name:"Double XP (5)",price:400,type:"coins"},
{id:"coins2",name:"Double Coins (5)",price:600,type:"coins"}
]
};

// ================= GAME =================

let tubes=[];
let selected=null;
let history=[];

function generate(){
let colors=["red","blue","green","yellow","purple"];
tubes=[];
for(let i=0;i<save.level+2;i++){
let arr=[];
for(let j=0;j<4;j++){
arr.push(colors[Math.floor(Math.random()*colors.length)]);
}
tubes.push(arr);
}
tubes.push([]);
}

function render(){
board.innerHTML="";
tubes.forEach((tube,i)=>{
let div=document.createElement("div");
div.className="tube";
div.onclick=()=>selectTube(i);

tube.forEach(c=>{
let ball=document.createElement("div");
ball.className="ball";
ball.style.background=c;

// SKINS
if(save.equipped.skin==="neon")
ball.style.boxShadow="0 0 15px "+c;

if(save.equipped.skin==="gold")
ball.style.background="gold";

if(save.equipped.skin==="shadow")
ball.style.background="black";

if(save.equipped.skin==="rainbow")
ball.style.background="linear-gradient(45deg,red,blue,green,yellow)";

// EFFECTS
if(save.equipped.effect==="fire")
ball.style.boxShadow="0 0 20px orange";

if(save.equipped.effect==="lightning")
ball.style.boxShadow="0 0 20px cyan";

if(save.equipped.effect==="pulse"){
ball.animate([
{transform:"scale(1)"},
{transform:"scale(1.2)"},
{transform:"scale(1)"}
],{duration:1000,iterations:Infinity});
}

div.appendChild(ball);
});

board.appendChild(div);
});
}

function selectTube(i){
if(selected===null){selected=i}
else{move(selected,i);selected=null}
}

function move(a,b){
if(tubes[a].length===0) return;
let top=tubes[a][tubes[a].length-1];
if(tubes[b].length>0 && tubes[b][tubes[b].length-1]!==top) return;
history.push(JSON.stringify(tubes));
tubes[b].push(tubes[a].pop());
render();
checkWin();
}

function undo(){
if(history.length>0){
tubes=JSON.parse(history.pop());
render();
}
}

function checkWin(){
let win=true;
tubes.forEach(t=>{
if(t.length>0 && !t.every(c=>c===t[0])) win=false;
});
if(win){
save.wins++;

let xpGain=100;
let coinGain=200;

if(save.boostersActive.xp2>0){
xpGain*=2;
save.boostersActive.xp2--;
}

if(save.boostersActive.coins2>0){
coinGain*=2;
save.boostersActive.coins2--;
}

save.xp+=xpGain;
save.coins+=coinGain;

if(save.xp>=300){
save.level++;
save.xp=0;
}

updateRank();
saveData();
updateHUD();
newGame();
}
}

function updateRank(){
if(save.level>20) save.rank="GOD";
else if(save.level>10) save.rank="Master";
else if(save.level>5) save.rank="Silver";
else save.rank="Bronze";
}

function hint(){
alert("جمع نفس اللون معًا 👑");
}

// ================= STORE SYSTEM =================

function renderStore(){
renderCategory(STORE.skins,"skinsStore","skins");
renderCategory(STORE.effects,"effectsStore","effects");
renderCategory(STORE.boosters,"boostersStore","boosters");
}

function renderCategory(items,elementId,category){
const container=document.getElementById(elementId);
container.innerHTML="";

items.forEach(item=>{
let owned=save.inventory[category][item.id];
let div=document.createElement("div");
div.className="store-item";

let btn=document.createElement("button");

if(owned){
btn.innerText="Equip";
btn.onclick=()=>equipItem(category,item.id);
}else{
btn.innerText=`Buy (${item.price} ${item.type})`;
btn.onclick=()=>buyItem(category,item);
}

div.innerHTML+=item.name+" ";
div.appendChild(btn);
container.appendChild(div);
});
}

function buyItem(category,item){
if(save[item.type]>=item.price){
save[item.type]-=item.price;
save.inventory[category][item.id]=true;

if(category==="boosters"){
save.boostersActive[item.id]+=5;
}

saveData();
updateHUD();
renderStore();
alert("Purchased!");
}else{
alert("Not enough "+item.type);
}
}

function equipItem(category,id){
if(category==="skins") save.equipped.skin=id;
if(category==="effects") save.equipped.effect=id;
saveData();
render();
alert("Equipped!");
}

// ================= UI =================

function updateHUD(){
coins.innerText=save.coins;
gems.innerText=save.gems;
xp.innerText=save.xp;
level.innerText=save.level;
rank.innerText=save.rank;
}

function newGame(){
generate();
render();
renderStore();
updateHUD();
}

updateHUD();
newGame();

</script>
</body>
</html>
