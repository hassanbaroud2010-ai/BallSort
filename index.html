<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ball Sort Game</title>

<style>
body{
    margin:0;
    background:#0f1220;
    color:white;
    font-family:Arial, sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
}

h1{
    margin:20px;
}

#game{
    display:flex;
    gap:20px;
    margin-top:20px;
}

.tube{
    width:60px;
    height:200px;
    background:#1c1f2b;
    border-radius:10px;
    padding:10px;
    display:flex;
    flex-direction:column-reverse;
    align-items:center;
    cursor:pointer;
}

.ball{
    width:40px;
    height:40px;
    border-radius:50%;
    margin:4px 0;
}

button{
    margin-top:20px;
    padding:8px 16px;
    background:#1c1f2b;
    border:1px solid #333;
    color:white;
    border-radius:6px;
    cursor:pointer;
}
button:hover{
    background:#2a2f40;
}
</style>
</head>

<body>

<h1>Ball Sort</h1>

<div id="game"></div>

<button onclick="resetGame()">Reset</button>

<script>

let tubes = [];
let selectedTube = null;

const colors = ["red","blue","green","yellow"];

function initGame(){
    tubes = [
        ["red","blue","green","yellow"],
        ["yellow","green","blue","red"],
        [],
        []
    ];
    render();
}

function render(){
    const game = document.getElementById("game");
    game.innerHTML="";

    tubes.forEach((tube,index)=>{
        const div=document.createElement("div");
        div.className="tube";
        div.onclick=()=>selectTube(index);

        tube.forEach(color=>{
            const ball=document.createElement("div");
            ball.className="ball";
            ball.style.background=color;
            div.appendChild(ball);
        });

        game.appendChild(div);
    });
}

function selectTube(index){

    if(selectedTube===null){
        if(tubes[index].length===0) return;
        selectedTube=index;
    }else{
        moveBall(selectedTube,index);
        selectedTube=null;
    }

}

function moveBall(from,to){

    if(from===to) return;

    if(tubes[from].length===0) return;

    if(tubes[to].length>=4) return;

    const ball = tubes[from][tubes[from].length-1];

    if(tubes[to].length===0 || tubes[to][tubes[to].length-1]===ball){
        tubes[to].push(tubes[from].pop());
    }

    render();
    checkWin();
}

function checkWin(){
    let win=true;

    tubes.forEach(tube=>{
        if(tube.length===0) return;
        if(tube.length!==4) win=false;
        const first=tube[0];
        tube.forEach(ball=>{
            if(ball!==first) win=false;
        });
    });

    if(win){
        setTimeout(()=>{
            alert("You Win! 🎉");
        },200);
    }
}

function resetGame(){
    initGame();
}

initGame();

</script>

</body>
</html>
