<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AXIS GOD ENGINE — ULTRA</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>
:root{
 --neon:#00f0ff;
 --bg1:#050816;
 --bg2:#0d1428;
 --glass:rgba(255,255,255,0.05);
}

*{margin:0;padding:0;box-sizing:border-box;font-family:'Orbitron',sans-serif;}

body{
 background:linear-gradient(145deg,var(--bg1),var(--bg2));
 color:white;
 text-align:center;
}

header{
 padding:20px;
 font-size:28px;
 color:var(--neon);
 text-shadow:0 0 15px var(--neon);
 animation:glow 2s infinite alternate;
}

@keyframes glow{
 from{ text-shadow:0 0 10px var(--neon);}
 to{ text-shadow:0 0 25px var(--neon);}
}

.hud{
 display:flex;
 justify-content:center;
 gap:40px;
 padding:15px;
 backdrop-filter:blur(10px);
 background:var(--glass);
}

.game-container{
 display:flex;
 justify-content:center;
 gap:20px;
 margin-top:50px;
 flex-wrap:wrap;
}

.tube{
 width:90px;
 height:300px;
 border:2px solid var(--neon);
 border-radius:20px;
 display:flex;
 flex-direction:column-reverse;
 align-items:center;
 padding:10px;
 gap:10px;
 cursor:pointer;
 transition:0.3s;
}

.tube:hover{
 box-shadow:0 0 20px var(--neon);
}

.ball{
 width:60px;
 height:60px;
 border-radius:50%;
 transition:0.3s;
}

.controls{margin-top:30px;}

button{
 padding:10px 25px;
 margin:5px;
 border:none;
 border-radius:8px;
 background:var(--neon);
 color:black;
 font-weight:bold;
 cursor:pointer;
}

.shop,.achievements{
 margin-top:50px;
 padding:20px;
 background:var(--glass);
}

.popup{
 position:fixed;
 top:50%;
 left:50%;
 transform:translate(-50%,-50%);
 background:#111;
 padding:40px;
 border:2px solid var(--neon);
 display:none;
}
</style>
</head>
<body>

<header>AXIS GOD ENGINE — ULTRA</header>

<div class="hud">
 <div>💰 <span id="coins"></span></div>
 <div>⭐ XP: <span id="xp"></span></div>
 <div>🏆 Level: <span id="level"></span></div>
</div>

<div class="game-container" id="board"></div>

<div class="controls">
 <button onclick="newGame()">لعبة جديدة</button>
</div>

<div class="shop">
 <h2>المتجر</h2>
 <button onclick="buySkin('#ff00ff',300)">Neon Pink (300)</button>
 <button onclick="buySkin('#00ff88',400)">Cyber Green (400)</button>
</div>

<div class="achievements">
 <h2>الإنجازات</h2>
 <div id="achList"></div>
</div>

<div class="popup" id="winPopup">
 <h2>🎉 فزت!</h2>
 <button onclick="closePopup()">إغلاق</button>
</div>

<script>

let state = JSON.parse(localStorage.getItem("axisSave")) || {
 coins:200,
 xp:0,
 level:1,
 wins:0,
 skin:"#00f0ff",
 achievements:{first:false,five:false,ten:false}
};

let tubesData = [];
let selectedTube=null;

function save(){ localStorage.setItem("axisSave",JSON.stringify(state)); }

function updateHUD(){
 document.getElementById("coins").innerText=state.coins;
 document.getElementById("xp").innerText=state.xp;
 document.getElementById("level").innerText=state.level;
 document.documentElement.style.setProperty('--neon',state.skin);
}

function generateLevel(){
 let colors=["red","blue","green","yellow","purple"];
 let difficulty=state.level+2;
 tubesData=[];
 for(let i=0;i<difficulty;i++){
  let arr=[];
  for(let j=0;j<4;j++){
   arr.push(colors[Math.floor(Math.random()*difficulty%colors.length)]);
  }
  tubesData.push(arr);
 }
 tubesData.push([]);
}

function render(){
 const board=document.getElementById("board");
 board.innerHTML="";
 tubesData.forEach((tube,i)=>{
  let div=document.createElement("div");
  div.className="tube";
  div.onclick=()=>selectTube(i);
  tube.forEach(color=>{
   let ball=document.createElement("div");
   ball.className="ball";
   ball.style.background=color;
   div.appendChild(ball);
  });
  board.appendChild(div);
 });
}

function selectTube(i){
 if(selectedTube===null){selectedTube=i;}
 else{
  moveBall(selectedTube,i);
  selectedTube=null;
 }
}

function moveBall(from,to){
 if(tubesData[from].length===0) return;
 let ball=tubesData[from].pop();
 tubesData[to].push(ball);
 render();
 checkWin();
}

function checkWin(){
 let win=true;
 tubesData.forEach(tube=>{
  if(tube.length>0){
   if(!tube.every(c=>c===tube[0])) win=false;
  }
 });
 if(win){
  state.wins++;
  state.coins+=100;
  state.xp+=50;
  if(state.xp>=200){
   state.level++;
   state.xp=0;
  }
  unlockAchievements();
  save();
  updateHUD();
  document.getElementById("winPopup").style.display="block";
 }
}

function unlockAchievements(){
 if(state.wins>=1) state.achievements.first=true;
 if(state.wins>=5) state.achievements.five=true;
 if(state.wins>=10) state.achievements.ten=true;
 renderAchievements();
}

function renderAchievements(){
 let el=document.getElementById("achList");
 el.innerHTML="";
 for(let key in state.achievements){
  if(state.achievements[key]){
   let div=document.createElement("div");
   div.innerText="✔ "+key;
   el.appendChild(div);
  }
 }
}

function buySkin(color,price){
 if(state.coins>=price){
  state.coins-=price;
  state.skin=color;
  save();
  updateHUD();
 }
}

function newGame(){
 generateLevel();
 render();
}

function closePopup(){
 document.getElementById("winPopup").style.display="none";
 newGame();
}

updateHUD();
renderAchievements();
newGame();

</script>
</body>
</html>
