<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AXIS – LOCAL LEGEND MAX</title>
<style>
body{
    background:#111;
    color:white;
    text-align:center;
    font-family:Arial;
}
button{
    padding:8px 12px;
    margin:5px;
    cursor:pointer;
}
</style>
</head>
<body>

<h1>AXIS – LOCAL LEGEND MAX 👑</h1>
<div id="status"></div>

<script>

/* ===============================
   GAME VERSION
================================= */

const GAME_VERSION = "LEGEND_MAX_1.0";

/* ===============================
   CORE STATE
================================= */

let State = {
    level:1,
    gridSize:3,
    grid:[],
    moves:0,
    history:[],
    seed:1,
    startTime:null,
    timeAttack:false
};

let Profile = {
    id:"P-"+Math.random().toString(36).substr(2,9),
    name:"Player",
    xp:0,
    level:1,
    coins:0,
    wins:0,
    perfects:0,
    totalStars:0,
    prestige:0,
    skin:"default"
};

let Economy = {
    skinsOwned:["default"],
    shop:{
        skins:[
            {id:"red",price:100},
            {id:"blue",price:150},
            {id:"gold",price:300}
        ]
    }
};

let Clan = {
    id:null,
    name:null,
    xp:0,
    level:1,
    members:[]
};

let Ranking = [];

/* ===============================
   SAVE / LOAD
================================= */

function saveGame(){
    localStorage.setItem("AXIS_SAVE",JSON.stringify({
        version:GAME_VERSION,
        State,Profile,Economy,Clan,Ranking
    }));
}

function loadGame(){
    const save = JSON.parse(localStorage.getItem("AXIS_SAVE"));
    if(!save) return;
    if(save.version!==GAME_VERSION) return;
    State=save.State;
    Profile=save.Profile;
    Economy=save.Economy;
    Clan=save.Clan;
    Ranking=save.Ranking;
}

/* ===============================
   PRNG SEED
================================= */

function seededRandom(){
    const x = Math.sin(State.seed++)*10000;
    return x-Math.floor(x);
}

/* ===============================
   GRID GENERATOR
================================= */

function generateGrid(){
    State.grid=[];
    for(let r=0;r<State.gridSize;r++){
        let row=[];
        for(let c=0;c<State.gridSize;c++){
            row.push(Math.floor(seededRandom()*2));
        }
        State.grid.push(row);
    }
}

/* ===============================
   TOGGLE LOGIC
================================= */

function toggleCell(r,c){

    State.history.push(JSON.stringify(State.grid));
    State.moves++;

    const dirs=[[0,0],[1,0],[-1,0],[0,1],[0,-1]];
    dirs.forEach(d=>{
        let nr=r+d[0], nc=c+d[1];
        if(nr>=0 && nr<State.gridSize && nc>=0 && nc<State.gridSize){
            State.grid[nr][nc]^=1;
        }
    });

    renderGame();
    checkWin();
}

function undoMove(){
    if(State.history.length===0) return;
    State.grid=JSON.parse(State.history.pop());
    State.moves--;
    renderGame();
}

/* ===============================
   SOLVER (BFS)
================================= */

function solveGrid(initial){

    const size=State.gridSize;
    const serialize=g=>g.flat().join("");
    const target="0".repeat(size*size);

    let queue=[[initial,0]];
    let visited=new Set();
    visited.add(serialize(initial));

    while(queue.length){
        const [grid,moves]=queue.shift();
        if(serialize(grid)===target) return moves;

        for(let r=0;r<size;r++){
            for(let c=0;c<size;c++){

                let newGrid=JSON.parse(JSON.stringify(grid));
                const dirs=[[0,0],[1,0],[-1,0],[0,1],[0,-1]];
                dirs.forEach(d=>{
                    let nr=r+d[0], nc=c+d[1];
                    if(nr>=0&&nr<size&&nc>=0&&nc<size){
                        newGrid[nr][nc]^=1;
                    }
                });

                const key=serialize(newGrid);
                if(!visited.has(key)){
                    visited.add(key);
                    queue.push([newGrid,moves+1]);
                }
            }
        }
    }
    return null;
}

/* ===============================
   WIN CHECK
================================= */

function checkPerfect(){
    const optimal = solveGrid(JSON.parse(JSON.stringify(State.grid)));
    return State.moves===optimal;
}

function checkWin(){

    const allZero=State.grid.flat().every(v=>v===0);

    if(allZero){
        setTimeout(()=>{

            const optimal = solveGrid(JSON.parse(JSON.stringify(State.grid)));
            let stars=1;
            if(State.moves<=optimal) stars=3;
            else if(State.moves<=optimal+2) stars=2;

            Profile.totalStars+=stars;
            Profile.wins++;
            Profile.xp+=50*stars;
            Profile.coins+=20*stars;

            Ranking.push({
                name:Profile.name,
                level:State.level,
                stars
            });

            alert("Cleared! ⭐ x"+stars);

            nextLevel();

        },100);
    }
}

/* ===============================
   NEXT LEVEL
================================= */

function nextLevel(){
    State.level++;
    State.gridSize = 3 + Math.floor(State.level/3);
    State.moves=0;
    State.history=[];
    State.seed=Date.now();
    generateGrid();
    renderGame();
    saveGame();
}

/* ===============================
   RENDER
================================= */

function renderGame(){

    let html="";

    for(let r=0;r<State.gridSize;r++){
        html+="<div style='display:flex;justify-content:center;'>";
        for(let c=0;c<State.gridSize;c++){

            const v=State.grid[r][c];

            html+=`
            <div onclick="toggleCell(${r},${c})"
            style="
            width:50px;height:50px;margin:4px;
            background:${v?"#4caf50":"#1e1e1e"};
            display:flex;align-items:center;justify-content:center;
            cursor:pointer;border-radius:8px;">
            ${v}
            </div>`;
        }
        html+="</div>";
    }

    document.getElementById("status").innerHTML=`
    Level:${State.level} |
    Moves:${State.moves} |
    XP:${Profile.xp} |
    Coins:${Profile.coins}
    `+html;

    renderMainUI();
}

/* ===============================
   PROFILE / STORE / CLAN
================================= */

function renderMainUI(){
    document.getElementById("status").innerHTML+=`
    <div>
    <button onclick="undoMove()">Undo</button>
    <button onclick="openProfile()">Profile</button>
    <button onclick="openStore()">Store</button>
    <button onclick="openClan()">Clan</button>
    </div>`;
}

function openProfile(){
    document.getElementById("status").innerHTML=`
    <h2>Profile</h2>
    Name:<input value="${Profile.name}"
    onchange="Profile.name=this.value;saveGame();"><br>
    XP:${Profile.xp}<br>
    Wins:${Profile.wins}<br>
    Stars:${Profile.totalStars}<br>
    <button onclick="renderGame()">Back</button>`;
}

function openStore(){
    let html=`<h2>Store</h2>Coins:${Profile.coins}<br>`;
    Economy.shop.skins.forEach(s=>{
        html+=`
        ${s.id} - ${s.price}
        <button onclick="buySkin('${s.id}',${s.price})">Buy</button><br>`;
    });
    html+=`<button onclick="renderGame()">Back</button>`;
    document.getElementById("status").innerHTML=html;
}

function buySkin(id,price){
    if(Profile.coins<price)return;
    Profile.coins-=price;
    Economy.skinsOwned.push(id);
    saveGame();
    openStore();
}

function openClan(){
    document.getElementById("status").innerHTML=`
    <h2>Clan</h2>
    Name:${Clan.name||"None"}<br>
    <button onclick="renderGame()">Back</button>`;
}

/* ===============================
   INIT
================================= */

loadGame();
generateGrid();
renderGame();
saveGame();

</script>
</body>
</html>
