<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AXIS GOD ENGINE - MEGA</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:linear-gradient(135deg,#0f0f1a,#0b1026);
    color:white;
    text-align:center;
}
h1{ text-shadow:0 0 20px #00ffff; }

#topbar{
    display:flex;
    justify-content:space-around;
    padding:10px;
    background:#111827;
    box-shadow:0 0 20px #00ffff44;
}

#board{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:20px;
    margin:20px;
}

.tube{
    width:80px;
    height:220px;
    border:3px solid #00ffff;
    border-radius:20px;
    display:flex;
    flex-direction:column-reverse;
    padding:5px;
    cursor:pointer;
    transition:0.2s;
}
.tube.selected{ box-shadow:0 0 25px #ff00ff; }

.ball{
    width:55px;
    height:55px;
    border-radius:50%;
    margin:3px auto;
}

button{
    padding:8px 15px;
    border:none;
    border-radius:8px;
    background:#00ffff;
    cursor:pointer;
    font-weight:bold;
}
button:hover{ background:#ff00ff; color:white; }

.panel{
    background:#111827;
    padding:10px;
    margin:10px;
    border-radius:10px;
    box-shadow:0 0 10px #00ffff33;
}
</style>
</head>
<body>

<h1>AXIS GOD ENGINE</h1>

<div id="topbar">
<div>💰 <span id="coins">0</span></div>
<div>⭐ XP: <span id="xp">0</span></div>
<div>🏆 Level: <span id="level">1</span></div>
<div>🔥 Combo: <span id="combo">0</span></div>
<div>⏱️ <span id="timer">0</span>s</div>
</div>

<div id="board"></div>

<div>
<button onclick="restart()">إعادة</button>
<button onclick="openShop()">المتجر</button>
<button onclick="showAchievements()">الإنجازات</button>
</div>

<div id="panelArea"></div>

<script>
/* ===============================
   DATA SYSTEM
=================================*/
let capacity = 4;
let tubes = [];
let selected = null;
let startTime;
let timerInterval;
let combo = 0;

let gameData = JSON.parse(localStorage.getItem("axisData")) || {
    coins: 0,
    xp: 0,
    level: 1,
    skins: ["classic"],
    activeSkin: "classic",
    achievements: {},
    season: 1,
    wins: 0,
    clan: "None",
    ranking: 0
};

/* ===============================
   LEVEL SYSTEM
=================================*/
function generateLevel(){
    let colors = ["red","blue","green","yellow","purple","orange"];
    let level = gameData.level;
    let used = colors.slice(0,Math.min(3+Math.floor(level/3),6));
    let arr=[];
    used.forEach(c=>{
        for(let i=0;i<capacity;i++) arr.push(c);
    });
    arr.sort(()=>Math.random()-0.5);

    let result=[];
    let tubeCount = used.length+2;
    for(let i=0;i<tubeCount;i++) result.push([]);

    let index=0;
    for(let i=0;i<used.length;i++){
        for(let j=0;j<capacity;j++){
            result[i].push(arr[index++]);
        }
    }
    return result;
}

/* ===============================
   START
=================================*/
function startGame(){
    tubes = generateLevel();
    startTime = Date.now();
    timerInterval = setInterval(updateTimer,1000);
    render();
    updateUI();
}

/* ===============================
   GAMEPLAY
=================================*/
function render(){
    const board=document.getElementById("board");
    board.innerHTML="";
    tubes.forEach((tube,i)=>{
        const div=document.createElement("div");
        div.className="tube";
        if(selected===i) div.classList.add("selected");
        div.onclick=()=>selectTube(i);
        tube.forEach(color=>{
            const ball=document.createElement("div");
            ball.className="ball";
            ball.style.background=color;
            if(gameData.activeSkin==="neon"){
                ball.style.boxShadow="0 0 20px "+color;
            }
            div.appendChild(ball);
        });
        board.appendChild(div);
    });
}

function selectTube(i){
    if(selected===null){
        if(tubes[i].length===0) return;
        selected=i;
    }else{
        move(selected,i);
        selected=null;
    }
    render();
}

function move(from,to){
    if(from===to) return;
    if(tubes[from].length===0) return;
    if(tubes[to].length>=capacity) return;

    let ball=tubes[from][tubes[from].length-1];
    if(tubes[to].length===0 || tubes[to][tubes[to].length-1]===ball){
        tubes[to].push(tubes[from].pop());
        combo++;
        gameData.xp+=5;
        updateUI();
        checkWin();
    } else {
        combo=0;
    }
}

function checkWin(){
    let win=true;
    for(let t of tubes){
        if(t.length===0) continue;
        if(t.length!==capacity) win=false;
        if(!t.every(c=>c===t[0])) win=false;
    }
    if(win){
        clearInterval(timerInterval);
        rewardPlayer();
    }
}

/* ===============================
   REWARD + LEVEL UP
=================================*/
function rewardPlayer(){
    let reward=50+combo*10;
    gameData.coins+=reward;
    gameData.wins++;
    gameData.xp+=100;

    if(gameData.xp>=gameData.level*200){
        gameData.xp=0;
        gameData.level++;
    }

    unlockAchievements();
    save();
    alert("فزت! +" + reward + " Coins");
    startGame();
}

/* ===============================
   ACHIEVEMENTS
=================================*/
function unlockAchievements(){
    if(gameData.wins>=1) gameData.achievements["First Win"]=true;
    if(gameData.wins>=10) gameData.achievements["Pro Player"]=true;
}

function showAchievements(){
    let html="<div class='panel'><h3>الإنجازات</h3>";
    for(let key in gameData.achievements){
        html+="<div>🏆 "+key+"</div>";
    }
    html+="</div>";
    document.getElementById("panelArea").innerHTML=html;
}

/* ===============================
   SHOP
=================================*/
function openShop(){
    let html="<div class='panel'><h3>المتجر</h3>";
    html+="<button onclick='buySkin()'>شراء Neon Skin (200)</button>";
    html+="</div>";
    document.getElementById("panelArea").innerHTML=html;
}

function buySkin(){
    if(gameData.coins>=200){
        gameData.coins-=200;
        gameData.skins.push("neon");
        gameData.activeSkin="neon";
        save();
        render();
        updateUI();
    } else {
        alert("لا يوجد Coins كافية");
    }
}

/* ===============================
   UTIL
=================================*/
function updateTimer(){
    let sec=Math.floor((Date.now()-startTime)/1000);
    document.getElementById("timer").innerText=sec;
}

function updateUI(){
    document.getElementById("coins").innerText=gameData.coins;
    document.getElementById("xp").innerText=gameData.xp;
    document.getElementById("level").innerText=gameData.level;
    document.getElementById("combo").innerText=combo;
}

function save(){
    localStorage.setItem("axisData",JSON.stringify(gameData));
}

function restart(){
    startGame();
}

startGame();
</script>

</body>
</html>
